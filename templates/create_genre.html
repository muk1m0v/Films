{% extends 'base.html' %}
{% load static %}
{% block title %}Create Genre{% endblock title %}
{% block extra_css %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
{% endblock extra_css %}
{% block context %}
    <div class="movie-form">
        <h1>Create Genre</h1>
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <input type="text" id="name" name="name" placeholder="Имя Жанра" required>
            </div>
            <button type="submit" class="Enter">Создать Жанр</button>
        </form>
    </div>
{% endblock context %}
